<!DOCTYPE html>
<html class="light" lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>HotOrNot Notifications</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#c3223d",
                        "primary-dark": "#8F1D2B",
                        "background-light": "#ffffff",
                        "background-dark": "#22252a",
                        "charcoal": "#323841",
                    },
                    fontFamily: {
                        "display": ["Epilogue", "sans-serif"],
                        "body": ["'Plus Jakarta Sans'", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .font-display {
            font-family: 'Epilogue', sans-serif;
        }

        .bg-glass {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
        }

        .gradient-orb {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.15;
        }

        .orb-1 {
            top: -50px;
            right: -50px;
            background: #c3223d;
        }

        .orb-2 {
            bottom: 100px;
            left: -100px;
            background: #8F1D2B;
        }

        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body
    class="bg-background-light dark:bg-background-dark min-h-screen text-charcoal dark:text-white selection:bg-primary/20">
    <!-- Background Orbs -->
    <div class="gradient-orb orb-1"></div>
    <div class="gradient-orb orb-2"></div>
    <div
        class="relative mx-auto max-w-[430px] min-h-screen flex flex-col shadow-2xl bg-white/40 dark:bg-background-dark/40">
        <!-- Sticky TopAppBar -->
        <header class="sticky top-0 z-50 bg-glass border-b border-gray-100 dark:border-gray-800">
            <div class="flex items-center justify-between px-6 py-4">
                <button
                    class="flex items-center justify-center size-10 rounded-full bg-primary/5 text-primary hover:bg-primary/10 transition-colors">
                    <span class="material-symbols-outlined text-[22px]">arrow_back_ios_new</span>
                </button>
                <h1 class="font-display text-xl font-bold tracking-tight text-gray-900 dark:text-white">Notifications
                </h1>
                <div
                    class="flex items-center px-3 py-1 bg-primary text-white text-[11px] font-bold rounded-full tracking-wider uppercase">
                    <span th:text="${notifications.size()} + ' Total'">12 Total</span>
                </div>
            </div>
        </header>
        <main class="flex-1 px-4 py-6 space-y-4">

            <!-- Notification Cards - Dynamic from Thymeleaf -->
            <div th:each="n : ${notifications}">

                <!-- Group Invite Notification Card -->
                <div th:if="${n.type == 'GROUP_INVITE'}"
                    class="group relative bg-white dark:bg-gray-900 rounded-xl border shadow-sm overflow-hidden p-4"
                    th:classappend="${!n.readStatus} ? 'border-primary/40' : 'border-gray-100 dark:border-gray-800'">
                    <div class="flex gap-4">
                        <div class="relative flex-shrink-0">
                            <div
                                class="size-14 rounded-full bg-gradient-to-br from-primary/20 to-primary-dark/20 border-2 border-white shadow-md flex items-center justify-center">
                                <span class="material-symbols-outlined text-primary text-[28px]">person</span>
                            </div>
                            <div
                                class="absolute -bottom-1 -right-1 size-6 bg-primary rounded-full flex items-center justify-center text-white border-2 border-white">
                                <span class="material-symbols-outlined text-[14px]">groups</span>
                            </div>
                        </div>
                        <div class="flex-1">
                            <div class="flex justify-between items-start mb-1">
                                <p class="text-xs font-bold text-primary uppercase tracking-widest">Group Invite</p>
                                <span class="text-[11px] text-gray-400 font-medium"
                                    th:text="${#temporals.format(n.createdAt,'dd MMM, HH:mm')}">2m ago</span>
                            </div>
                            <p class="text-[15px] leading-snug font-medium text-gray-800 dark:text-gray-200"
                                th:utext="${n.message}">
                            </p>
                        </div>
                    </div>
                    <!-- Action Buttons -->
                    <div th:if="${!n.readStatus}" class="flex gap-3 mt-4">
                        <form th:action="@{/user/notifications/group/accept}" method="post" class="flex-1">
                            <input type="hidden" name="notificationId" th:value="${n.id}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit"
                                class="w-full h-11 bg-gradient-to-r from-[#A12331] to-[#8F1D2B] text-white rounded-full font-bold text-sm shadow-md active:scale-95 transition-transform">
                                ✅ Accept
                            </button>
                        </form>

                        <form th:action="@{/user/notifications/group/reject}" method="post" class="flex-1">
                            <input type="hidden" name="notificationId" th:value="${n.id}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit"
                                class="w-full h-11 border-2 border-charcoal/20 dark:border-gray-700 text-charcoal dark:text-gray-300 rounded-full font-bold text-sm hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
                                ❌ Reject
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Regular Interaction Notification Card (with Quick Replies) -->
                <div th:if="${n.type != 'GROUP_INVITE' and n.type != 'GROUP_INVITE_ACCEPTED' and n.type != 'GROUP_INVITE_REJECTED'}"
                    class="bg-white dark:bg-gray-900 rounded-xl border border-gray-100 dark:border-gray-800 shadow-sm p-4">
                    <div class="flex gap-4 mb-4">
                        <div
                            class="size-14 rounded-full bg-gradient-to-br from-primary/20 to-primary-dark/20 shadow-sm flex items-center justify-center">
                            <span class="material-symbols-outlined text-primary text-[28px]">person</span>
                        </div>
                        <div class="flex-1">
                            <div class="flex justify-between items-start mb-1">
                                <p class="text-xs font-bold text-gray-400 uppercase tracking-widest">New Interaction</p>
                                <span class="text-[11px] text-gray-400 font-medium"
                                    th:text="${#temporals.format(n.createdAt,'dd MMM, HH:mm')}">15m ago</span>
                            </div>
                            <p class="text-[15px] leading-snug font-medium text-gray-800 dark:text-gray-200"
                                th:utext="${n.message}">
                            </p>
                        </div>
                    </div>

                    <!-- Quick Reply Form -->
                    <form th:if="${!n.readStatus}" th:action="@{/user/notification/reply}" method="post">
                        <input type="hidden" name="notificationId" th:value="${n.id}" />
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        <!-- Horizontal Quick Replies -->
                        <div class="flex gap-2 overflow-x-auto pb-2 -mx-1 px-1 no-scrollbar">
                            <button type="submit" name="reply" value="Excellent 🔥"
                                class="shrink-0 px-4 h-9 bg-yellow-50 dark:bg-yellow-900/20 text-charcoal dark:text-yellow-200 rounded-full text-sm font-medium border border-yellow-100 dark:border-yellow-900/30 flex items-center gap-2 hover:bg-yellow-100 dark:hover:bg-yellow-900/30 transition-colors">
                                Excellent 🔥
                            </button>
                            <button type="submit" name="reply" value="Good 👍"
                                class="shrink-0 px-4 h-9 bg-green-50 dark:bg-green-900/20 text-charcoal dark:text-green-200 rounded-full text-sm font-medium border border-green-100 dark:border-green-900/30 flex items-center gap-2 hover:bg-green-100 dark:hover:bg-green-900/30 transition-colors">
                                Good 👍
                            </button>
                            <button type="submit" name="reply" value="Impressive 👏"
                                class="shrink-0 px-4 h-9 bg-blue-50 dark:bg-blue-900/20 text-charcoal dark:text-blue-200 rounded-full text-sm font-medium border border-blue-100 dark:border-blue-900/30 flex items-center gap-2 hover:bg-blue-100 dark:hover:bg-blue-900/30 transition-colors">
                                Impressive 👏
                            </button>
                        </div>

                        <!-- Custom Input -->
                        <div class="mt-4 flex gap-2">
                            <div class="relative flex-1">
                                <input name="customReply"
                                    class="w-full h-10 px-4 bg-gray-50 dark:bg-gray-800 border-none rounded-full text-sm focus:ring-2 focus:ring-primary/20 placeholder:text-gray-400"
                                    placeholder="Write a custom reply..." type="text" />
                            </div>
                            <button type="submit"
                                class="size-10 flex items-center justify-center bg-primary text-white rounded-full shadow-lg shadow-primary/20 active:scale-90 transition-transform">
                                <span class="material-symbols-outlined text-[20px]">send</span>
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Simple Status Notification (GROUP_INVITE_ACCEPTED/REJECTED) -->
                <div th:if="${n.type == 'GROUP_INVITE_ACCEPTED' or n.type == 'GROUP_INVITE_REJECTED'}"
                    class="bg-primary/5 dark:bg-primary/10 rounded-xl p-4 border-l-4 border-primary">
                    <div class="flex gap-4">
                        <div class="size-10 bg-primary/10 rounded-lg flex items-center justify-center text-primary">
                            <span class="material-symbols-outlined">info</span>
                        </div>
                        <div class="flex-1">
                            <div class="flex justify-between items-start mb-1">
                                <h4 class="font-display font-bold text-sm text-primary">Group Invite Status</h4>
                                <span class="text-[10px] text-gray-400 font-bold uppercase tracking-tighter"
                                    th:text="${#temporals.format(n.createdAt,'dd MMM, HH:mm')}">3h ago</span>
                            </div>
                            <p class="text-xs text-gray-600 dark:text-gray-300 mt-1 leading-relaxed"
                                th:utext="${n.message}">
                            </p>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Empty State -->
            <div th:if="${#lists.isEmpty(notifications)}" class="py-20 px-6 text-center">
                <div class="inline-flex flex-col items-center gap-4">
                    <div class="size-20 bg-gray-100 dark:bg-gray-800 rounded-full flex items-center justify-center">
                        <span class="material-symbols-outlined text-[48px] text-gray-300">notifications_off</span>
                    </div>
                    <div>
                        <h3 class="font-display font-bold text-lg text-gray-700 dark:text-gray-300 mb-1">No
                            notifications yet</h3>
                        <p class="text-sm text-gray-400">You're all caught up! ✨</p>
                    </div>
                </div>
            </div>

        </main>

        <!-- Footer Message -->
        <footer th:if="${!#lists.isEmpty(notifications)}" class="py-12 px-6 text-center">
            <div class="inline-flex items-center gap-2 px-4 py-2 bg-gray-50 dark:bg-gray-800/50 rounded-full">
                <span class="material-symbols-outlined text-[18px] text-gray-400">check_circle</span>
                <span class="text-xs font-medium text-gray-500 dark:text-gray-400">You're all caught up!</span>
            </div>
        </footer>

        <!-- Bottom Tab Bar -->
        <nav
            class="sticky bottom-0 bg-glass border-t border-gray-100 dark:border-gray-800 px-8 py-3 flex justify-between items-center">
            <button class="text-gray-400">
                <span class="material-symbols-outlined text-[28px]">home</span>
            </button>
            <button class="text-gray-400">
                <span class="material-symbols-outlined text-[28px]">search</span>
            </button>
            <button class="relative text-primary">
                <span class="material-symbols-outlined text-[28px]"
                    style="font-variation-settings: 'FILL' 1">notifications</span>
                <span th:if="${!#lists.isEmpty(notifications)}"
                    class="absolute top-0 right-0 size-2 bg-primary rounded-full ring-2 ring-white"></span>
            </button>
            <button class="text-gray-400">
                <span class="material-symbols-outlined text-[28px]">account_circle</span>
            </button>
        </nav>
    </div>
</body>

</html>
