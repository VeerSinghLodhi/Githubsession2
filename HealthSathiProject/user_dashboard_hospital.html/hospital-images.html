<!DOCTYPE html>
<html lang="hi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Hospital Images - Health Saathi</title>
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --primary-light: #dbeafe;
            --danger: #ef4444;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --border: #e2e8f0;
        }

        body {
            font-family: 'DM Sans', 'Noto Sans Devanagari', sans-serif;
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        .material-symbols-rounded {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.25rem;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
            transition: all 0.3s ease;
            margin-bottom: 2rem;
        }

        .back-btn:hover {
            background: var(--primary);
            color: white;
            transform: translateX(-4px);
        }

        .page-header {
            background: var(--bg-primary);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 2rem;
        }

        .header-content h1 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .header-content p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .upload-btn {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 1.5rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
        }

        .gallery-container {
            background: var(--bg-primary);
            border-radius: 20px;
            padding: 2rem;
            border: 1px solid var(--border);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .image-card {
            position: relative;
            aspect-ratio: 4/3;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid var(--border);
            transition: all 0.4s ease;
            cursor: pointer;
            background: var(--bg-secondary);
        }

        .image-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
            border-color: var(--primary);
        }

        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .image-card:hover img {
            transform: scale(1.05);
        }

        .image-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8) 0%, rgba(0, 0, 0, 0.3) 50%, transparent 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }

        .image-card:hover .image-overlay {
            opacity: 1;
        }

        .overlay-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .overlay-btn.view {
            background: rgba(37, 99, 235, 0.9);
            color: white;
        }

        .overlay-btn.delete {
            background: rgba(239, 68, 68, 0.9);
            color: white;
        }

        .overlay-btn:hover {
            transform: scale(1.15);
        }

        .overlay-btn .material-symbols-rounded {
            font-size: 24px;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            background: var(--bg-secondary);
            border-radius: 16px;
            border: 2px dashed var(--border);
        }

        .empty-icon {
            width: 120px;
            height: 120px;
            background: var(--primary-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
        }

        .empty-icon .material-symbols-rounded {
            font-size: 64px;
            color: var(--primary);
        }

        .empty-state h3 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.75rem;
        }

        .empty-state p {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        /* Upload Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-primary);
            border-radius: 24px;
            padding: 2.5rem;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            animation: modalSlideIn 0.3s ease;
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
        }

        .modal-header h2 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .close-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: var(--bg-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: var(--border);
            transform: rotate(90deg);
        }

        .upload-area {
            border: 3px dashed var(--border);
            border-radius: 16px;
            padding: 3rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: var(--bg-secondary);
            margin-bottom: 1.5rem;
        }

        .upload-area:hover,
        .upload-area.dragover {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        .upload-icon {
            width: 80px;
            height: 80px;
            background: var(--primary-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
        }

        .upload-icon .material-symbols-rounded {
            font-size: 40px;
            color: var(--primary);
        }

        .upload-area h3 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .upload-area p {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .preview-item {
            position: relative;
            aspect-ratio: 1;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid var(--border);
        }

        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .preview-remove {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(239, 68, 68, 0.95);
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .preview-remove:hover {
            transform: scale(1.1);
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
        }

        .btn {
            flex: 1;
            padding: 1rem;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: var(--border);
        }

        /* Image Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox-content {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
            animation: zoomIn 0.3s ease;
        }

        @keyframes zoomIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .lightbox-content img {
            max-width: 100%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        .lightbox-close {
            position: absolute;
            top: -50px;
            right: 0;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .lightbox-close:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(90deg);
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            }

            .modal-content {
                padding: 1.5rem;
            }

            .lightbox-close {
                top: 10px;
                right: 10px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- Back Button -->
        <a th:href="@{'/hospital/dashboard/' + ${hospital.hospitalId}}" class="back-btn">
            <span class="material-symbols-rounded">arrow_back</span>
            <span>Back to Dashboard</span>
        </a>

        <!-- Page Header -->
        <div class="page-header">
            <div class="header-content">
                <h1>Hospital Images</h1>
                <p>Manage and showcase your hospital's facilities and environment</p>
            </div>
            <button class="upload-btn" onclick="openUploadModal()">
                <span class="material-symbols-rounded">add_photo_alternate</span>
                <span>Upload Images</span>
            </button>
        </div>

        <!-- Gallery -->
        <div class="gallery-container">
            <!-- Images Grid -->
            <div th:if="${hospital.images != null && !#lists.isEmpty(hospital.images)}" class="gallery-grid">
                <div th:each="image : ${hospital.images}" class="image-card">
                    <img th:src="@{'/user/api/hospital/image/' + ${image.imageId}}" th:alt="${hospital.name}"
                        onerror="this.src='/images/placeholder-hospital.jpg'">
                    <div class="image-overlay">
                        <button class="overlay-btn view" th:onclick="'viewImage(\'' + ${image.imageId} + '\')'">
                            <span class="material-symbols-rounded">visibility</span>
                        </button>
                        <button class="overlay-btn delete" th:onclick="'deleteImage(\'' + ${image.imageId} + '\')'">
                            <span class="material-symbols-rounded">delete</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Empty State -->
            <div th:unless="${hospital.images != null && !#lists.isEmpty(hospital.images)}" class="empty-state">
                <div class="empty-icon">
                    <span class="material-symbols-rounded">image</span>
                </div>
                <h3>No Images Yet</h3>
                <p>Upload images to showcase your hospital facilities and environment</p>
                <button class="upload-btn" onclick="openUploadModal()">
                    <span class="material-symbols-rounded">add_photo_alternate</span>
                    <span>Upload First Image</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Image Lightbox -->
    <div id="imageLightbox" class="lightbox" onclick="closeLightbox(event)">
        <div class="lightbox-content">
            <button class="lightbox-close" onclick="closeLightbox(event)">
                <span class="material-symbols-rounded">close</span>
            </button>
            <img id="lightboxImage" src="" alt="Full size image">
        </div>
    </div>

    <!-- Upload Modal -->
    <div id="uploadModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Upload Images</h2>
                <button class="close-btn" onclick="closeUploadModal()">
                    <span class="material-symbols-rounded">close</span>
                </button>
            </div>

            <form id="uploadForm" th:action="@{'/hospital/upload-images/' + ${hospital.hospitalId}}" method="post"
                enctype="multipart/form-data">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">
                        <span class="material-symbols-rounded">cloud_upload</span>
                    </div>
                    <h3>Drag & Drop Images</h3>
                    <p>or click to browse files</p>
                    <input type="file" id="imageInput" name="images" multiple accept="image/*" style="display: none;">
                </div>

                <div id="previewGrid" class="preview-grid"></div>

                <div class="modal-actions">
                    <button type="submit" class="btn btn-primary">
                        <span class="material-symbols-rounded">upload</span>
                        <span>Upload Images</span>
                    </button>
                    <button type="button" class="btn btn-secondary" onclick="closeUploadModal()">
                        <span class="material-symbols-rounded">close</span>
                        <span>Cancel</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script th:inline="javascript">
        const csrfToken = /*[[${_csrf.token}]]*/ '';
        const csrfHeader = /*[[${_csrf.headerName}]]*/ '';

        let selectedFiles = [];

        function openUploadModal() {
            document.getElementById('uploadModal').classList.add('active');
        }

        function closeUploadModal() {
            document.getElementById('uploadModal').classList.remove('active');
            selectedFiles = [];
            document.getElementById('previewGrid').innerHTML = '';
            document.getElementById('imageInput').value = '';
        }

        const uploadArea = document.getElementById('uploadArea');
        const imageInput = document.getElementById('imageInput');

        uploadArea.addEventListener('click', () => imageInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        imageInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        function handleFiles(files) {
            selectedFiles = Array.from(files);
            displayPreviews();
        }

        function displayPreviews() {
            const previewGrid = document.getElementById('previewGrid');
            previewGrid.innerHTML = '';

            selectedFiles.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const div = document.createElement('div');
                    div.className = 'preview-item';
                    div.innerHTML = `
          <img src="${e.target.result}" alt="Preview">
          <button type="button" class="preview-remove" onclick="removePreview(${index})">
            <span class="material-symbols-rounded" style="font-size: 18px;">close</span>
          </button>
        `;
                    previewGrid.appendChild(div);
                };
                reader.readAsDataURL(file);
            });
        }

        function removePreview(index) {
            selectedFiles.splice(index, 1);
            displayPreviews();

            const dataTransfer = new DataTransfer();
            selectedFiles.forEach(file => dataTransfer.items.add(file));
            imageInput.files = dataTransfer.files;
        }

        function viewImage(imageId) {
            const lightbox = document.getElementById('imageLightbox');
            const lightboxImage = document.getElementById('lightboxImage');
            lightboxImage.src = '/user/api/hospital/image/' + imageId;
            lightbox.classList.add('active');
        }

        function closeLightbox(event) {
            if (event.target.id === 'imageLightbox' || event.target.closest('.lightbox-close')) {
                document.getElementById('imageLightbox').classList.remove('active');
            }
        }

        function deleteImage(imageId) {
            if (confirm('Are you sure you want to delete this image?')) {
                fetch('/hospital/delete-image/' + imageId, {
                    method: 'DELETE',
                    headers: {
                        [csrfHeader]: csrfToken
                    }
                })
                    .then(response => {
                        if (response.ok) {
                            location.reload();
                        } else {
                            const errorMsg = document.createElement('div');
                            errorMsg.style.cssText = 'position:fixed;top:20px;right:20px;background:#fee2e2;color:#991b1b;padding:1rem 1.5rem;border-radius:12px;border-left:4px solid #ef4444;z-index:3000;';
                            errorMsg.textContent = 'Failed to delete image. Please try again.';
                            document.body.appendChild(errorMsg);
                            setTimeout(() => errorMsg.remove(), 3000);
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        const errorMsg = document.createElement('div');
                        errorMsg.style.cssText = 'position:fixed;top:20px;right:20px;background:#fee2e2;color:#991b1b;padding:1rem 1.5rem;border-radius:12px;border-left:4px solid #ef4444;z-index:3000;';
                        errorMsg.textContent = 'Error deleting image. Please check your connection.';
                        document.body.appendChild(errorMsg);
                        setTimeout(() => errorMsg.remove(), 3000);
                    });
            }
        }
    </script>

</body>

</html>
