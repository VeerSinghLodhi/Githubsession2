<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Senior Citizen Mode</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Font Awesome for Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* ================= NORMAL MODE ================= */
        body {
            font-family: Arial, sans-serif;
            font-size: 16px;
            line-height: 1.5;
            background: #f4f4f4;
            color: #333;
            margin: 0;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .container {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            max-width: 600px;
            margin: auto;
        }

        h1 {
            font-size: 26px;
        }

        button {
            font-size: 14px;
            padding: 8px 14px;
        }

        /* ================= SENIOR MODE ================= */
        body.senior-mode {
            font-size: 22px;
            line-height: 1.9;
            background: #ffffff;
            color: #000;
        }

        body.senior-mode h1 {
            font-size: 34px;
        }

        body.senior-mode button {
            font-size: 20px;
            padding: 14px 24px;
        }

        /* ================= FLOATING ICON ================= */
        .senior-icon {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: #007bff;
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            cursor: pointer;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
            z-index: 1000;
        }

        body.senior-mode .senior-icon {
            background: #28a745;
        }

        /* Tooltip */
        .tooltip {
            position: fixed;
            bottom: 90px;
            right: 20px;
            background: #000;
            color: #fff;
            padding: 6px 10px;
            border-radius: 5px;
            font-size: 14px;
            display: none;
        }

        .show {
            display: block;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Mobile Friendly App</h1>
        <p>
            Tap the accessibility icon on the screen to enable
            <b>Senior Citizen Mode</b>.
        </p>
        <p>
            This improves readability by increasing font size,
            spacing, and button size.
        </p>
        <button>Sample Button</button>
    </div>

    <!-- FLOATING ICON -->
    <div class="senior-icon" id="seniorIcon">
        <i class="fa-solid fa-person-cane"></i>
    </div>

    <div class="tooltip" id="tooltip">
        Senior Citizen Mode
    </div>

    <script>
        const icon = document.getElementById("seniorIcon");
        const tooltip = document.getElementById("tooltip");

        // Toggle Mode
        icon.addEventListener("click", () => {
            document.body.classList.toggle("senior-mode");

            if (document.body.classList.contains("senior-mode")) {
                localStorage.setItem("seniorMode", "on");
            } else {
                localStorage.setItem("seniorMode", "off");
            }
        });

        // Tooltip on hover (desktop)
        icon.addEventListener("mouseenter", () => {
            tooltip.classList.add("show");
        });

        icon.addEventListener("mouseleave", () => {
            tooltip.classList.remove("show");
        });

        // Load saved mode
        if (localStorage.getItem("seniorMode") === "on") {
            document.body.classList.add("senior-mode");
        }
    </script>

</body>

</html>
