<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Senior Citizen Accessibility Mode</title>

    <style>
        /* =====================
           NORMAL MODE (DEFAULT)
           ===================== */
        body {
            font-family: Arial, sans-serif;
            font-size: 16px;
            line-height: 1.5;
            background-color: #f5f5f5;
            color: #333;
            margin: 0;
            padding: 20px;
            transition: all 0.3s ease;
        }

        h1 {
            font-size: 26px;
        }

        p {
            font-size: 16px;
        }

        button {
            font-size: 14px;
            padding: 8px 16px;
            cursor: pointer;
        }

        input,
        select {
            font-size: 14px;
            padding: 6px;
        }

        .container {
            max-width: 700px;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            margin: auto;
        }

        .toggle {
            margin-bottom: 20px;
        }

        /* =========================
           SENIOR CITIZEN MODE
           ========================= */
        body.senior-mode {
            font-size: 21px;
            line-height: 1.9;
            background-color: #ffffff;
            color: #000000;
        }

        body.senior-mode h1 {
            font-size: 34px;
        }

        body.senior-mode p {
            font-size: 21px;
        }

        body.senior-mode button {
            font-size: 20px;
            padding: 14px 26px;
        }

        body.senior-mode input,
        body.senior-mode select {
            font-size: 18px;
            padding: 12px;
        }

        body.senior-mode label {
            font-size: 20px;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- TOGGLE -->
        <div class="toggle">
            <label>
                <input type="checkbox" id="seniorToggle">
                Enable Senior Citizen Mode
            </label>
        </div>

        <h1>Welcome to Our Application</h1>

        <p>
            This application provides a special <b>Senior Citizen Mode</b>
            to make content easier to read and interact with.
        </p>

        <p>
            When Senior Mode is enabled, text becomes larger, buttons are
            easier to click, and spacing improves for better visibility.
        </p>

        <form>
            <label>Name:</label><br>
            <input type="text" placeholder="Enter your name"><br><br>

            <label>Age Group:</label><br>
            <select>
                <option>Below 60</option>
                <option>Senior Citizen (60+)</option>
            </select><br><br>

            <button type="button">Submit</button>
        </form>

    </div>

    <script>
        const toggle = document.getElementById("seniorToggle");

        // Toggle Senior Mode
        toggle.addEventListener("change", function () {
            if (this.checked) {
                document.body.classList.add("senior-mode");
                localStorage.setItem("seniorMode", "on");
            } else {
                document.body.classList.remove("senior-mode");
                localStorage.setItem("seniorMode", "off");
            }
        });

        // Load saved mode
        if (localStorage.getItem("seniorMode") === "on") {
            document.body.classList.add("senior-mode");
            toggle.checked = true;
        }
    </script>

</body>

</html>
