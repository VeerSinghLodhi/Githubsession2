<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>सभी अस्पताल - हेल्थ साथी</title>
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#0058ba",
                        "primary-dark": "#155a96",
                        "primary-light": "#e3f2fd",
                        "text-main": "#1e293b",
                        "text-secondary": "#64748b",
                        "border-light": "#e2e8f0",
                        "surface": "#ffffff",
                        "background": "#f8fafc",
                    },
                    fontFamily: {
                        "display": ["Noto Sans Devanagari", "sans-serif"],
                        "hindi": ["Noto Sans Devanagari", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.75rem",
                        "xl": "1rem",
                        "2xl": "1.25rem",
                        "3xl": "1.5rem"
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -4px rgba(30, 115, 190, 0.1)',
                        'glow': '0 8px 30px rgba(30, 115, 190, 0.2)',
                        'card': '0 2px 12px rgba(0, 0, 0, 0.06)',
                        'hover': '0 8px 25px rgba(30, 115, 190, 0.15)',
                    }
                },
            },
        }
    </script>
    <link rel="stylesheet" th:href="@{/FragmentStyle.css}" />
    <style>
        .hospital-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: linear-gradient(135deg, #e3f2fd 0%, #f8fafc 100%);
        }

        .hospital-card {
            transition: all 0.3s ease;
        }

        .hospital-card:hover {
            transform: translateY(-4px);
        }

        .facility-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 12px;
            background: #f1f5f9;
            border-radius: 16px;
            font-size: 12px;
            color: #64748b;
            margin: 4px;
        }

        .search-box {
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
        }

        .search-input {
            padding-left: 48px;
        }

        .filter-chip {
            padding: 8px 16px;
            border-radius: 20px;
            border: 2px solid #e2e8f0;
            background: white;
            font-size: 14px;
            font-weight: 500;
            color: #64748b;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-chip.active {
            background: #0058ba;
            color: white;
            border-color: #0058ba;
        }

        .filter-chip:hover:not(.active) {
            border-color: #0058ba;
            color: #0058ba;
        }
    </style>
</head>

<body class="bg-background antialiased text-text-main">
    <div class="relative flex min-h-screen w-full flex-col overflow-hidden pb-24">

        <!-- Header -->
        <header class="sticky top-0 z-20 bg-white/90 backdrop-blur-md px-5 py-4 border-b border-slate-100">
            <div class="flex items-center gap-4">
                <button onclick="window.history.back()"
                    class="flex items-center justify-center size-10 rounded-full bg-slate-50 text-slate-600 hover:bg-slate-100 transition-colors">
                    <span class="material-symbols-outlined text-[24px]">arrow_back</span>
                </button>
                <div class="flex-1">
                    <h1 class="text-xl font-bold text-slate-900">सभी अस्पताल</h1>
                    <p class="text-xs text-slate-500">All Hospitals</p>
                </div>
                <div class="flex items-center gap-2">
                    <span class="material-symbols-outlined text-primary text-[24px]">local_hospital</span>
                    <span class="text-sm font-semibold text-slate-900" th:text="${#lists.size(hospitals)}">0</span>
                </div>
            </div>
        </header>

        <main class="flex-1 flex flex-col gap-6 p-5">

            <!-- Search Bar -->
            <div class="search-box">
                <span class="material-symbols-outlined search-icon text-[20px]">search</span>
                <input type="text" id="searchInput"
                    class="search-input w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all"
                    placeholder="अस्पताल खोजें... (Search hospitals)" onkeyup="filterHospitals()">
            </div>

            <!-- Filter Chips -->
            <div class="flex gap-2 overflow-x-auto pb-2">
                <button class="filter-chip active" onclick="filterByType('ALL')" id="filter-all">
                    सभी (All)
                </button>
                <button class="filter-chip" th:each="type : ${hospitalTypes}"
                    th:onclick="'filterByType(\'' + ${type.typeId} + '\')'" th:id="'filter-' + ${type.typeId}"
                    th:text="${type.typeName}">
                    प्रकार
                </button>
            </div>

            <!-- Hospital Stats -->
            <div class="grid grid-cols-3 gap-3">
                <div class="bg-blue-50 rounded-xl p-4 text-center">
                    <div class="text-2xl font-bold text-blue-600" th:text="${totalHospitals}">0</div>
                    <div class="text-xs text-blue-800">कुल अस्पताल</div>
                </div>
                <div class="bg-green-50 rounded-xl p-4 text-center">
                    <div class="text-2xl font-bold text-green-600" th:text="${availableNow}">0</div>
                    <div class="text-xs text-green-800">24/7 उपलब्ध</div>
                </div>
                <div class="bg-purple-50 rounded-xl p-4 text-center">
                    <div class="text-2xl font-bold text-purple-600" th:text="${emergencyReady}">0</div>
                    <div class="text-xs text-purple-800">आपातकालीन</div>
                </div>
            </div>

            <!-- Hospitals Grid -->
            <div id="hospitals-container" class="grid grid-cols-1 gap-4">

                <div th:each="hospital : ${hospitals}"
                    class="hospital-card bg-white rounded-2xl overflow-hidden border border-slate-100 shadow-soft hover:shadow-hover"
                    th:attr="data-hospital-name=${hospital.name},
                          data-hospital-type=${hospital.type.typeId},
                          data-hospital-address=${hospital.address}"
                    th:onclick="'window.location.href=\'/user/hospital/' + ${hospital.hospitalId} + '\''">

                    <!-- Hospital Image -->
                    <div class="relative">
                        <img th:if="${hospital.primaryImage != null}"
                            th:src="@{'/user/api/hospital/image/' + ${hospital.primaryImage.imageId}}"
                            alt="Hospital Image" class="hospital-image">
                        <div th:unless="${hospital.primaryImage != null}"
                            class="hospital-image flex items-center justify-center">
                            <span class="material-symbols-outlined text-slate-300 text-[64px]">local_hospital</span>
                        </div>

                        <!-- Type Badge -->
                        <div class="absolute top-3 left-3">
                            <span
                                class="px-3 py-1 bg-white/90 backdrop-blur-sm rounded-full text-xs font-semibold text-primary"
                                th:text="${hospital.type.typeName}">प्रकार</span>
                        </div>

                        <!-- 24/7 Badge -->
                        <div th:if="${hospital.timings == '24/7'}" class="absolute top-3 right-3">
                            <span
                                class="px-3 py-1 bg-green-500/90 backdrop-blur-sm rounded-full text-xs font-semibold text-white">
                                24/7
                            </span>
                        </div>
                    </div>

                    <!-- Hospital Info -->
                    <div class="p-5">
                        <h3 class="text-lg font-bold text-slate-900 mb-2" th:text="${hospital.name}">अस्पताल का नाम</h3>

                        <!-- Description -->
                        <p th:if="${hospital.description != null}"
                            class="text-sm text-slate-600 leading-relaxed mb-3 line-clamp-2"
                            th:text="${hospital.description}">विवरण</p>

                        <!-- Contact Info -->
                        <div class="space-y-2 mb-4">
                            <div class="flex items-start gap-2">
                                <span
                                    class="material-symbols-outlined text-slate-400 text-[18px] mt-0.5">location_on</span>
                                <p class="text-sm text-slate-600 flex-1" th:text="${hospital.address}">पता</p>
                            </div>

                            <div class="flex items-center gap-2">
                                <span class="material-symbols-outlined text-slate-400 text-[18px]">call</span>
                                <p class="text-sm text-slate-600" th:text="${hospital.contact}">संपर्क</p>
                            </div>

                            <div th:if="${hospital.email != null}" class="flex items-center gap-2">
                                <span class="material-symbols-outlined text-slate-400 text-[18px]">email</span>
                                <p class="text-sm text-slate-600" th:text="${hospital.email}">ईमेल</p>
                            </div>

                            <div th:if="${hospital.timings != null && hospital.timings != '24/7'}"
                                class="flex items-center gap-2">
                                <span class="material-symbols-outlined text-slate-400 text-[18px]">schedule</span>
                                <p class="text-sm text-slate-600" th:text="${hospital.timings}">समय</p>
                            </div>
                        </div>

                        <!-- Facilities Tags -->
                        <div th:if="${hospital.facilities != null}" class="mb-4">
                            <div class="flex flex-wrap -m-1">
                                <span th:each="facility : ${hospital.facilities.split(',')}" class="facility-tag"
                                    th:text="${facility.trim()}">
                                    सुविधा
                                </span>
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="flex gap-2">
                            <button
                                class="flex-1 py-2 bg-primary hover:bg-primary-dark text-white text-sm font-semibold rounded-xl transition-colors flex items-center justify-center gap-1">
                                <span class="material-symbols-outlined text-[16px]">info</span>
                                विवरण देखें
                            </button>
                            <button th:if="${hospital.contact != null}"
                                th:onclick="'event.stopPropagation(); window.location.href=\'tel:' + ${hospital.contact} + '\''"
                                class="px-4 py-2 bg-green-500 hover:bg-green-600 text-white rounded-xl transition-colors flex items-center justify-center">
                                <span class="material-symbols-outlined text-[20px]">call</span>
                            </button>
                            <button th:if="${hospital.website != null}"
                                th:onclick="'event.stopPropagation(); window.open(\'' + ${hospital.website} + '\', \'_blank\')'"
                                class="px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-xl transition-colors flex items-center justify-center">
                                <span class="material-symbols-outlined text-[20px]">language</span>
                            </button>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Empty State -->
            <div id="empty-state" class="hidden text-center py-16">
                <span class="material-symbols-outlined text-slate-300 text-[80px] mb-4">search_off</span>
                <h3 class="text-lg font-bold text-slate-900 mb-2">कोई अस्पताल नहीं मिला</h3>
                <p class="text-slate-500 text-sm mb-6">कृपया अपनी खोज बदलें या फ़िल्टर साफ़ करें</p>
                <button onclick="clearFilters()"
                    class="px-6 py-3 bg-primary hover:bg-primary-dark text-white text-sm font-semibold rounded-xl transition-colors">
                    फ़िल्टर साफ़ करें
                </button>
            </div>

        </main>

        <div th:insert="~{Fragment/PatientMobileFragment :: NavContent}"></div>

    </div>

    <script th:src="@{/FragmentScript.js}"></script>
    <script>
        let currentTypeFilter = 'ALL';

        function filterHospitals() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const hospitals = document.querySelectorAll('.hospital-card');
            const emptyState = document.getElementById('empty-state');
            let visibleCount = 0;

            hospitals.forEach(hospital => {
                const name = hospital.getAttribute('data-hospital-name').toLowerCase();
                const address = hospital.getAttribute('data-hospital-address').toLowerCase();
                const typeId = hospital.getAttribute('data-hospital-type');

                const matchesSearch = name.includes(searchTerm) || address.includes(searchTerm);
                const matchesType = currentTypeFilter === 'ALL' || typeId === currentTypeFilter;

                if (matchesSearch && matchesType) {
                    hospital.style.display = 'block';
                    visibleCount++;
                } else {
                    hospital.style.display = 'none';
                }
            });

            if (visibleCount === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
            }
        }

        function filterByType(typeId) {
            currentTypeFilter = typeId;

            // Update active filter chip
            document.querySelectorAll('.filter-chip').forEach(chip => {
                chip.classList.remove('active');
            });

            if (typeId === 'ALL') {
                document.getElementById('filter-all').classList.add('active');
            } else {
                document.getElementById('filter-' + typeId).classList.add('active');
            }

            filterHospitals();
        }

        function clearFilters() {
            document.getElementById('searchInput').value = '';
            filterByType('ALL');
        }
    </script>
</body>

</html>
