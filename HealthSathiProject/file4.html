<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Super Platformer - Dynamic World Map</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&family=Noto+Sans:wght@400;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f20d0d",
                        "background-light": "#f8f5f5",
                        "background-dark": "#221010",
                    },
                    fontFamily: {
                        "display": ["Spline Sans"]
                    },
                    borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" },
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }

        .filled-icon {
            font-variation-settings: 'FILL' 1;
        }

        .path-line {
            stroke: #ffffff;
            stroke-width: 4;
            stroke-dasharray: 8, 8;
            fill: none;
            stroke-linecap: round;
        }

        .path-progress {
            stroke: #f20d0d;
            stroke-width: 6;
            fill: none;
            stroke-linecap: round;
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
        }

        @keyframes drawPath {
            to {
                stroke-dashoffset: 0;
            }
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes shimmer {
            0% {
                background-position: -1000px 0;
            }

            100% {
                background-position: 1000px 0;
            }
        }

        .animate-float {
            animation: float 3s ease-in-out infinite;
        }

        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            background-size: 1000px 100%;
            animation: shimmer 2s infinite;
        }
    </style>
</head>

<body
    class="bg-background-light dark:bg-background-dark font-display text-[#181111] dark:text-white transition-colors duration-300">
    <div class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden">
        <div class="layout-container flex h-full grow flex-col">
            <!-- Top Navigation Bar -->
            <header
                class="flex items-center justify-between whitespace-nowrap border-b border-solid border-b-[#e6dbdb] dark:border-b-[#3d2a2a] px-10 py-3 bg-white dark:bg-background-dark/80 backdrop-blur-md sticky top-0 z-50">
                <div class="flex items-center gap-4 text-[#181111] dark:text-white">
                    <div class="size-6 text-primary">
                        <svg fill="currentColor" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M42.4379 44C42.4379 44 36.0744 33.9038 41.1692 24C46.8624 12.9336 42.2078 4 42.2078 4L7.01134 4C7.01134 4 11.6577 12.932 5.96912 23.9969C0.876273 33.9029 7.27094 44 7.27094 44L42.4379 44Z">
                            </path>
                        </svg>
                    </div>
                    <h2 class="text-lg font-bold leading-tight tracking-[-0.015em]">Super Platformer</h2>
                </div>
                <div class="flex flex-1 justify-end gap-8">
                    <div class="hidden md:flex items-center gap-9">
                        <a class="text-sm font-medium leading-normal hover:text-primary transition-colors cursor-pointer"
                            onclick="showNotification('World Map Active')">World Map</a>
                        <a class="text-sm font-medium leading-normal hover:text-primary transition-colors cursor-pointer"
                            onclick="showNotification('Leaderboard Coming Soon!')">Leaderboard</a>
                        <a class="text-sm font-medium leading-normal hover:text-primary transition-colors cursor-pointer"
                            onclick="toggleShop()">Shop</a>
                        <a class="text-sm font-medium leading-normal hover:text-primary transition-colors cursor-pointer"
                            onclick="toggleDarkMode()">Theme</a>
                    </div>
                    <button
                        class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-full h-10 px-4 bg-primary text-white text-sm font-bold leading-normal tracking-[0.015em] hover:bg-primary/90"
                        onclick="showProfile()">
                        <span class="truncate">Profile</span>
                    </button>
                    <div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-10 border-2 border-primary/20 cursor-pointer hover:scale-110 transition-transform"
                        onclick="showProfile()"
                        style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuD0cJvExwGKalEEw_2DhevrI1GWqJ6nS5rRwKlItfqV1gbjA9GU4Sl8Mrn7rgJpNiLXNLRWvON53YBk2qCFtj13GoDVP6FwtFX42uvwTKcJZKGGyKQyX63I0k8jPpYBEjpkCsAd0Xz2HD3H-WZJxgGlUCekwvKNz3lW0FZ-w80_JYsXNOQFNcArFvPOY_njbR5fiAD9pzyD5sHqmLA3fDszRJqXfSoud92oauoDuU9wedQp5bMBET9-MSLLnQOv4Tc4VV-xuC-Q3Q");'>
                    </div>
                </div>
            </header>

            <main class="flex flex-1 flex-col items-center">
                <!-- World Title Section -->
                <div class="w-full max-w-[960px] pt-8 px-4">
                    <div
                        class="bg-white dark:bg-[#3d2a2a] rounded-full px-6 py-2 shadow-sm inline-flex items-center gap-2 mx-auto border border-[#e6dbdb] dark:border-[#523a3a]">
                        <span class="material-symbols-outlined text-primary">public</span>
                        <h1 class="text-[#181111] dark:text-white tracking-light text-xl font-bold leading-tight"
                            id="worldTitle">World 1: Elemental Isles</h1>
                    </div>
                </div>

                <!-- Stats HUD -->
                <div class="w-full max-w-[960px] px-4">
                    <div class="flex flex-wrap gap-4 py-6">
                        <div class="flex min-w-[120px] flex-1 items-center gap-4 rounded-xl p-4 bg-white dark:bg-[#3d2a2a] border border-[#e6dbdb] dark:border-[#523a3a] shadow-sm hover:shadow-md transition-shadow cursor-pointer"
                            onclick="showStatsDetail('stars')">
                            <div class="p-2 bg-yellow-100 dark:bg-yellow-900/30 rounded-lg">
                                <span class="material-symbols-outlined text-yellow-500 filled-icon">star</span>
                            </div>
                            <div>
                                <p class="text-xs font-medium text-gray-500 dark:text-gray-400">Total Stars</p>
                                <p class="text-xl font-bold" id="starsCount">42 / 120</p>
                            </div>
                        </div>
                        <div class="flex min-w-[120px] flex-1 items-center gap-4 rounded-xl p-4 bg-white dark:bg-[#3d2a2a] border border-[#e6dbdb] dark:border-[#523a3a] shadow-sm hover:shadow-md transition-shadow cursor-pointer"
                            onclick="showStatsDetail('lives')">
                            <div class="p-2 bg-red-100 dark:bg-red-900/30 rounded-lg">
                                <span class="material-symbols-outlined text-primary filled-icon">favorite</span>
                            </div>
                            <div>
                                <p class="text-xs font-medium text-gray-500 dark:text-gray-400">Lives</p>
                                <p class="text-xl font-bold" id="livesCount">5</p>
                            </div>
                        </div>
                        <div class="flex min-w-[120px] flex-1 items-center gap-4 rounded-xl p-4 bg-white dark:bg-[#3d2a2a] border border-[#e6dbdb] dark:border-[#523a3a] shadow-sm hover:shadow-md transition-shadow cursor-pointer"
                            onclick="showStatsDetail('coins')">
                            <div class="p-2 bg-blue-100 dark:bg-blue-900/30 rounded-lg">
                                <span class="material-symbols-outlined text-blue-500 filled-icon">monetization_on</span>
                            </div>
                            <div>
                                <p class="text-xs font-medium text-gray-500 dark:text-gray-400">Coins</p>
                                <p class="text-xl font-bold" id="coinsCount">1,250</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Main Overworld Map Canvas Area -->
                <div class="w-full max-w-[1200px] px-4 pb-12">
                    <div class="relative overflow-hidden rounded-xl h-[500px] border-4 border-white dark:border-[#3d2a2a] shadow-2xl bg-slate-200"
                        id="mapContainer">
                        <!-- Map Background with Biomes -->
                        <div class="absolute inset-0 flex transition-all duration-1000" id="biomeContainer">
                            <div class="flex-1 bg-[#d4f3d4] dark:bg-[#1a331a] relative transition-all duration-500">
                                <div class="absolute inset-0 opacity-20"
                                    style="background-image: radial-gradient(#2d5a27 2px, transparent 2px); background-size: 20px 20px;">
                                </div>
                            </div>
                            <div class="flex-1 bg-[#fff4d1] dark:bg-[#332b1a] relative transition-all duration-500">
                                <div class="absolute inset-0 opacity-20"
                                    style="background-image: radial-gradient(#8b7535 2px, transparent 2px); background-size: 30px 30px;">
                                </div>
                            </div>
                            <div class="flex-1 bg-[#ffd1d1] dark:bg-[#331a1a] relative transition-all duration-500">
                                <div class="absolute inset-0 opacity-20"
                                    style="background-image: radial-gradient(#8b3535 2px, transparent 2px); background-size: 25px 25px;">
                                </div>
                            </div>
                        </div>

                        <!-- Level Path SVG Overlay -->
                        <svg class="absolute inset-0 w-full h-full pointer-events-none" id="pathSvg">
                            <path class="path-line opacity-50"
                                d="M 100 250 Q 200 150 300 250 T 500 250 T 700 250 T 900 250" id="mainPath"></path>
                            <path class="path-progress" d="M 100 250 Q 200 150 300 250" id="progressPath"></path>
                        </svg>

                        <!-- Level Nodes Container -->
                        <div class="absolute inset-0 z-10" id="levelNodes"></div>

                        <!-- Map Controls -->
                        <div class="absolute bottom-6 right-6 flex flex-col gap-3 z-20">
                            <div
                                class="flex flex-col rounded-full bg-white dark:bg-[#3d2a2a] shadow-lg overflow-hidden border border-[#e6dbdb] dark:border-[#523a3a]">
                                <button class="p-3 hover:bg-gray-100 dark:hover:bg-white/10 transition-colors"
                                    onclick="zoomMap(1.2)">
                                    <span class="material-symbols-outlined">add</span>
                                </button>
                                <div class="h-px bg-[#e6dbdb] dark:bg-[#523a3a] mx-2"></div>
                                <button class="p-3 hover:bg-gray-100 dark:hover:bg-white/10 transition-colors"
                                    onclick="zoomMap(0.8)">
                                    <span class="material-symbols-outlined">remove</span>
                                </button>
                            </div>
                            <button
                                class="size-12 rounded-full bg-white dark:bg-[#3d2a2a] shadow-lg flex items-center justify-center border border-[#e6dbdb] dark:border-[#523a3a] hover:bg-gray-100 dark:hover:bg-white/10"
                                onclick="resetMapView()">
                                <span class="material-symbols-outlined">near_me</span>
                            </button>
                        </div>

                        <!-- Level Search Overlay -->
                        <div class="absolute top-6 left-6 z-20 w-64">
                            <div class="relative group">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <span class="material-symbols-outlined text-gray-400 text-lg">search</span>
                                </div>
                                <input
                                    class="w-full bg-white/90 dark:bg-background-dark/90 backdrop-blur border-none rounded-xl py-2 pl-10 pr-4 text-sm focus:ring-2 focus:ring-primary shadow-lg"
                                    placeholder="Search levels..." type="text" id="levelSearch"
                                    oninput="searchLevels(this.value)" />
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Footer Section -->
                <div class="w-full max-w-[960px] px-4 pb-20">
                    <div
                        class="flex justify-between items-center bg-white dark:bg-[#3d2a2a] p-6 rounded-2xl border border-[#e6dbdb] dark:border-[#523a3a] shadow-sm">
                        <div class="flex flex-col gap-1">
                            <h3 class="font-bold text-lg">Continue Playing?</h3>
                            <p class="text-sm text-gray-500 dark:text-gray-400" id="progressText">Current Progress:
                                World 1-3</p>
                        </div>
                        <div class="flex gap-4">
                            <button
                                class="px-6 py-3 rounded-full font-bold text-sm bg-gray-100 dark:bg-white/10 hover:bg-gray-200 dark:hover:bg-white/20 transition-all"
                                onclick="returnToMenu()">
                                Return to Menu
                            </button>
                            <button
                                class="px-8 py-3 rounded-full font-bold text-sm bg-primary text-white shadow-lg shadow-primary/20 hover:scale-105 active:scale-95 transition-all"
                                onclick="startCurrentLevel()" id="startButton">
                                Start Level 1-3
                            </button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="notification"
        class="fixed top-24 right-6 bg-white dark:bg-[#3d2a2a] px-6 py-4 rounded-xl shadow-2xl border-2 border-primary transform translate-x-[400px] transition-transform duration-300 z-50">
        <p class="font-bold" id="notificationText"></p>
    </div>

    <script>
        const gameState = {
            stars: 42,
            maxStars: 120,
            lives: 5,
            coins: 1250,
            currentLevel: 3,
            completedLevels: [1, 2],
            zoom: 1,
            levels: [
                { id: 1, name: 'Greenery Grove', x: 80, y: 230, completed: true, stars: 3 },
                { id: 2, name: 'Sandy Dunes', x: 280, y: 230, completed: true, stars: 3 },
                { id: 3, name: 'Lava Land', x: 480, y: 230, completed: false, stars: 0, current: true },
                { id: 4, name: 'Oasis Springs', x: 680, y: 230, completed: false, stars: 0, locked: true },
                { id: 5, name: 'Boss Castle', x: 880, y: 230, completed: false, stars: 0, locked: true, boss: true }
            ]
        };

        function renderLevels() {
            const container = document.getElementById('levelNodes');
            container.innerHTML = '';

            gameState.levels.forEach(level => {
                const levelDiv = document.createElement('div');
                levelDiv.className = `absolute group transition-all duration-300`;
                levelDiv.style.left = `${level.x}px`;
                levelDiv.style.top = `${level.y}px`;

                if (level.current) {
                    levelDiv.classList.add('animate-float');
                }

                let nodeContent = '';

                if (level.boss) {
                    nodeContent = `
                    <div class="${level.locked ? 'opacity-60' : ''} ${level.current ? 'relative' : ''}">
                        ${level.current ? '<div class="absolute -inset-2 bg-primary/30 rounded-xl animate-pulse"></div>' : ''}
                        <div class="relative w-20 h-20 rounded-xl ${level.locked ? 'bg-gray-500 dark:bg-gray-700 cursor-not-allowed' : 'bg-primary cursor-pointer hover:scale-110'} border-4 border-white shadow-${level.locked ? 'md' : 'xl'} flex items-center justify-center transition-transform" onclick="${level.locked ? '' : `selectLevel(${level.id})`}">
                            <div class="absolute -top-4">
                                <span class="material-symbols-outlined text-3xl">${level.locked ? '' : '🏰'}</span>
                            </div>
                            ${level.locked ? '<span class="material-symbols-outlined text-white text-xl">lock</span>' : '<span class="text-white font-bold text-lg">BOSS</span>'}
                        </div>
                    </div>
                `;
                } else {
                    nodeContent = `
                    <div class="${level.locked ? 'opacity-60' : ''} ${level.current ? 'relative' : ''}">
                        ${level.current ? '<div class="absolute -inset-2 bg-primary/30 rounded-full animate-pulse"></div>' : ''}
                        <div class="relative ${level.current ? 'w-14 h-14' : 'w-12 h-12'} rounded-full ${level.locked ? 'bg-gray-400 dark:bg-gray-600 cursor-not-allowed' : level.completed ? 'bg-primary cursor-pointer hover:scale-110' : 'bg-primary cursor-pointer hover:scale-110'} border-4 border-white shadow-${level.locked ? 'md' : 'lg'} flex items-center justify-center transition-transform" onclick="${level.locked ? '' : `selectLevel(${level.id})`}">
                            ${level.completed ? '<span class="material-symbols-outlined text-yellow-400 filled-icon text-sm">star</span>' : level.current ? `<span class="text-white font-bold">1-${level.id}</span>` : '<span class="material-symbols-outlined text-white text-sm">lock</span>'}
                        </div>
                    </div>
                `;
                }

                nodeContent += `
                <div class="absolute top-full mt-2 left-1/2 -translate-x-1/2 bg-white dark:bg-[#3d2a2a] px-3 py-1 rounded-lg text-xs font-bold whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity shadow-lg">
                    1-${level.id}: ${level.name}
                </div>
            `;

                if (level.current) {
                    nodeContent += `
                    <div class="absolute top-full mt-4 left-1/2 -translate-x-1/2 bg-white dark:bg-white text-primary px-4 py-2 rounded-xl text-sm font-black whitespace-nowrap shadow-lg animate-bounce border-2 border-primary">
                        PLAY NOW!
                    </div>
                `;
                }

                levelDiv.innerHTML = nodeContent;
                container.appendChild(levelDiv);
            });

            animateProgressPath();
        }

        function animateProgressPath() {
            const path = document.getElementById('progressPath');
            const completedCount = gameState.completedLevels.length;

            if (completedCount === 0) {
                path.style.strokeDashoffset = '1000';
            } else if (completedCount === 1) {
                path.setAttribute('d', 'M 100 250 Q 200 150 300 250');
                path.style.animation = 'drawPath 1s forwards';
            } else if (completedCount >= 2) {
                path.setAttribute('d', 'M 100 250 Q 200 150 300 250 T 500 250');
                path.style.animation = 'drawPath 1.5s forwards';
            }
        }

        function selectLevel(levelId) {
            const level = gameState.levels.find(l => l.id === levelId);
            if (level && !level.locked) {
                gameState.currentLevel = levelId;
                gameState.levels.forEach(l => l.current = l.id === levelId);
                renderLevels();
                updateProgressText();
                showNotification(`Selected Level 1-${levelId}: ${level.name}`);
            }
        }

        function startCurrentLevel() {
            const level = gameState.levels.find(l => l.current);
            if (level) {
                showNotification(`🎮 Starting ${level.name}! Good luck!`);
                setTimeout(() => {
                    completeLevel(level.id);
                }, 2000);
            }
        }

        function completeLevel(levelId) {
            const level = gameState.levels.find(l => l.id === levelId);
            if (level && !level.completed) {
                level.completed = true;
                level.stars = 3;
                gameState.completedLevels.push(levelId);
                gameState.stars += 3;
                gameState.coins += 100;

                if (levelId < gameState.levels.length) {
                    gameState.levels[levelId].locked = false;
                    gameState.levels[levelId].current = true;
                    level.current = false;
                    gameState.currentLevel = levelId + 1;
                }

                updateStats();
                renderLevels();
                showNotification(`⭐ Level Completed! +3 Stars, +100 Coins!`);
            }
        }

        function updateStats() {
            document.getElementById('starsCount').textContent = `${gameState.stars} / ${gameState.maxStars}`;
            document.getElementById('livesCount').textContent = gameState.lives;
            document.getElementById('coinsCount').textContent = gameState.coins.toLocaleString();
            updateProgressText();
        }

        function updateProgressText() {
            document.getElementById('progressText').textContent = `Current Progress: World 1-${gameState.currentLevel}`;
            document.getElementById('startButton').textContent = `Start Level 1-${gameState.currentLevel}`;
        }

        function showNotification(message) {
            const notif = document.getElementById('notification');
            document.getElementById('notificationText').textContent = message;
            notif.style.transform = 'translateX(0)';
            setTimeout(() => {
                notif.style.transform = 'translateX(400px)';
            }, 3000);
        }

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            showNotification(document.documentElement.classList.contains('dark') ? '🌙 Dark Mode' : '☀️ Light Mode');
        }

        function zoomMap(factor) {
            gameState.zoom *= factor;
            gameState.zoom = Math.max(0.5, Math.min(2, gameState.zoom));
            const container = document.getElementById('mapContainer');
            container.style.transform = `scale(${gameState.zoom})`;
            showNotification(`Zoom: ${Math.round(gameState.zoom * 100)}%`);
        }

        function resetMapView() {
            gameState.zoom = 1;
            document.getElementById('mapContainer').style.transform = 'scale(1)';
            showNotification('Map view reset');
        }

        function searchLevels(query) {
            if (!query) {
                gameState.levels.forEach((l, i) => {
                    const nodes = document.getElementById('levelNodes').children;
                    if (nodes[i]) nodes[i].style.opacity = '1';
                });
                return;
            }

            gameState.levels.forEach((level, i) => {
                const nodes = document.getElementById('levelNodes').children;
                if (nodes[i]) {
                    nodes[i].style.opacity = level.name.toLowerCase().includes(query.toLowerCase()) ? '1' : '0.2';
                }
            });
        }

        function showStatsDetail(type) {
            const messages = {
                stars: `You have ${gameState.stars} stars out of ${gameState.maxStars} possible!`,
                lives: `You have ${gameState.lives} lives remaining. Play carefully!`,
                coins: `You've collected ${gameState.coins} coins! Visit the shop to spend them.`
            };
            showNotification(messages[type]);
        }

        function toggleShop() {
            showNotification('🛒 Shop: Coming Soon! Save your coins!');
        }

        function showProfile() {
            showNotification('👤 Profile: View your achievements and stats!');
        }

        function returnToMenu() {
            showNotification('📋 Returning to main menu...');
        }

        renderLevels();
        updateStats();
    </script>
</body>

</html>
