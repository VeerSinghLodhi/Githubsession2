<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>सभी सुझाव - हेल्थ साथी</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#0058ba",
                        "primary-dark": "#155a96",
                        "primary-light": "#e3f2fd",
                        "text-main": "#1e293b",
                        "text-secondary": "#64748b",
                        "border-light": "#e2e8f0",
                        "surface": "#ffffff",
                        "background": "#f8fafc",
                    },
                    fontFamily: {
                        "display": ["Noto Sans Devanagari", "sans-serif"],
                        "hindi": ["Noto Sans Devanagari", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.75rem",
                        "xl": "1rem",
                        "2xl": "1.25rem",
                        "3xl": "1.5rem"
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -4px rgba(30, 115, 190, 0.1)',
                        'glow': '0 8px 30px rgba(30, 115, 190, 0.2)',
                        'card': '0 2px 12px rgba(0, 0, 0, 0.06)',
                        'hover': '0 8px 25px rgba(30, 115, 190, 0.15)',
                    }
                },
            },
        }
    </script>
    <link rel="stylesheet" th:href="@{/FragmentStyle.css}" />
    <style>
        .tab-active {
            background-color: #0058ba;
            color: white;
        }

        .tab-inactive {
            background-color: #f1f5f9;
            color: #64748b;
        }

        .viewed-card {
            background-color: #f8fafc !important;
            opacity: 0.7;
        }

        .save-btn {
            transition: all 0.3s ease;
        }

        .save-btn.saved {
            color: #0058ba;
        }

        .save-btn.saved .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 600;
        }
    </style>
</head>

<body class="bg-background antialiased text-text-main">
    <div class="relative flex min-h-screen w-full flex-col overflow-hidden pb-24">

        <!-- Header with Back Button -->
        <header class="sticky top-0 z-20 bg-white/90 backdrop-blur-md px-5 py-4 border-b border-slate-100">
            <div class="flex items-center gap-4">
                <button onclick="window.history.back()"
                    class="flex items-center justify-center size-10 rounded-full bg-slate-50 text-slate-600 hover:bg-slate-100 transition-colors">
                    <span class="material-symbols-outlined text-[24px]">arrow_back</span>
                </button>
                <div class="flex-1">
                    <h1 class="text-xl font-bold text-slate-900">सभी स्वास्थ्य सुझाव</h1>
                    <p class="text-xs text-slate-500">All Health Suggestions</p>
                </div>
                <button onclick="window.location.href='/suggestions/saved'"
                    class="flex items-center justify-center size-10 rounded-full bg-slate-50 text-slate-600 hover:bg-slate-100 transition-colors">
                    <span class="material-symbols-outlined text-[24px]">bookmark</span>
                </button>
            </div>
        </header>

        <main class="flex-1 flex flex-col gap-6 p-5">

            <!-- Tab Navigation -->
            <div class="flex gap-2 overflow-x-auto pb-2">
                <button onclick="filterSuggestions('ALL')" id="tab-all"
                    class="tab-active px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap transition-all">
                    सभी (All)
                </button>
                <button onclick="filterSuggestions('TEXT')" id="tab-text"
                    class="tab-inactive px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap transition-all">
                    लेख (Text)
                </button>
                <button onclick="filterSuggestions('VIDEO')" id="tab-video"
                    class="tab-inactive px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap transition-all">
                    वीडियो (Video)
                </button>
                <button onclick="filterSuggestions('IMAGE')" id="tab-image"
                    class="tab-inactive px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap transition-all">
                    चित्र (Image)
                </button>
            </div>

            <!-- Suggestions Grid -->
            <div id="suggestions-container" class="grid grid-cols-1 gap-4">

                <!-- Text Suggestions -->
                <div th:each="suggestion : ${allSuggestions}" th:if="${suggestion.suggestionType.name() == 'TEXT'}"
                    th:classappend="${viewedMap.get(suggestion.suggestionId)} ? 'viewed-card' : ''"
                    class="suggestion-card suggestion-TEXT bg-white rounded-2xl p-5 border border-slate-100 shadow-soft hover:shadow-hover transition-all cursor-pointer"
                    th:attr="data-suggestion-id=${suggestion.suggestionId},
                    data-title=${suggestion.title},
                    data-description=${suggestion.videoDescription},
                    data-text=${suggestion.text},
                    data-date=${#temporals.format(suggestion.postedDate, 'dd MMM yyyy')}"
                    th:onclick="'openTextModalAndMarkViewed(this, ' + ${suggestion.suggestionId} + ')'">
                    <div class="flex items-start justify-between mb-3">
                        <div class="flex items-center gap-2">
                            <span class="material-symbols-outlined text-slate-400 text-[24px]">article</span>
                            <span class="text-xs font-medium px-2 py-1 rounded-full bg-green-50 text-green-600"
                                th:text="${suggestion.category}">श्रेणी</span>
                            <span class="text-xs font-medium px-2 py-1 rounded-full bg-blue-50 text-blue-600">लेख</span>
                            <span th:if="${viewedMap.get(suggestion.suggestionId)}"
                                class="text-xs font-medium px-2 py-1 rounded-full bg-green-50 text-green-600">
                                ✓ देखा गया
                            </span>
                        </div>
                        <button th:onclick="'event.stopPropagation(); toggleSave(' + ${suggestion.suggestionId} + ')'"
                            th:classappend="${savedMap.get(suggestion.suggestionId)} ? 'saved' : ''"
                            class="save-btn flex items-center justify-center size-8 rounded-full hover:bg-slate-100 text-slate-400"
                            th:attr="data-save-btn=${suggestion.suggestionId}">
                            <span class="material-symbols-outlined text-[20px]">bookmark</span>
                        </button>
                    </div>
                    <h4 class="text-base font-bold text-slate-900 mb-2" th:text="${suggestion.title}">शीर्षक</h4>
                    <p class="text-sm text-slate-600 leading-relaxed mb-3 line-clamp-3"
                        th:text="${suggestion.videoDescription}">विवरण...</p>
                    <div class="flex items-center justify-between">
                        <span class="text-xs text-slate-400"
                            th:text="${#temporals.format(suggestion.postedDate, 'dd MMM yyyy')}">तारीख</span>
                        <button class="text-xs font-semibold text-primary hover:text-primary-dark transition-colors">और
                            पढ़ें →</button>
                    </div>
                </div>

                <!-- Video Suggestions -->
                <div th:each="suggestion : ${allSuggestions}" th:if="${suggestion.suggestionType.name() == 'VIDEO'}"
                    th:classappend="${viewedMap.get(suggestion.suggestionId)} ? 'viewed-card' : ''"
                    class="suggestion-card suggestion-VIDEO bg-white rounded-2xl overflow-hidden border border-slate-100 shadow-soft hover:shadow-hover transition-all cursor-pointer"
                    th:attr="data-video-url=${suggestion.link},
                    data-video-title=${suggestion.title},
                    data-video-description=${suggestion.videoDescription},
                    data-suggestion-id=${suggestion.suggestionId}"
                    th:onclick="'openVideoModalAndMarkViewed(this, ' + ${suggestion.suggestionId} + ')'">
                    <div class="video-thumbnail" th:attr="data-video-id=${suggestion.link}">
                        <div class="play-overlay">
                            <span class="material-symbols-outlined text-primary text-[48px]">play_circle</span>
                        </div>
                    </div>
                    <div class="p-4">
                        <div class="flex items-center justify-between mb-2">
                            <div class="flex items-center gap-2">
                                <span class="text-xs font-medium px-2 py-1 rounded-full bg-green-50 text-green-600"
                                    th:text="${suggestion.category}">श्रेणी</span>
                                <span
                                    class="text-xs font-medium px-2 py-1 rounded-full bg-red-50 text-red-600">वीडियो</span>
                                <span th:if="${viewedMap.get(suggestion.suggestionId)}"
                                    class="text-xs font-medium px-2 py-1 rounded-full bg-green-50 text-green-600">
                                    ✓ देखा गया
                                </span>
                            </div>
                            <button
                                th:onclick="'event.stopPropagation(); toggleSave(' + ${suggestion.suggestionId} + ')'"
                                th:classappend="${savedMap.get(suggestion.suggestionId)} ? 'saved' : ''"
                                class="save-btn flex items-center justify-center size-8 rounded-full hover:bg-slate-100 text-slate-400"
                                th:attr="data-save-btn=${suggestion.suggestionId}">
                                <span class="material-symbols-outlined text-[20px]">bookmark</span>
                            </button>
                        </div>
                        <h4 class="text-base font-bold text-slate-900 mb-2" th:text="${suggestion.title}">शीर्षक</h4>
                        <p class="text-sm text-slate-600 leading-relaxed mb-3 line-clamp-2"
                            th:text="${suggestion.videoDescription}">विवरण</p>
                        <div class="flex items-center justify-between text-xs text-slate-400 mb-3">
                            <span th:text="${#temporals.format(suggestion.postedDate, 'dd MMM yyyy')}">तारीख</span>
                        </div>
                        <button
                            class="w-full py-2 bg-primary hover:bg-primary-dark text-white text-sm font-semibold rounded-xl transition-colors flex items-center justify-center gap-1">
                            <span class="material-symbols-outlined text-[18px]">play_arrow</span>
                            वीडियो देखें
                        </button>
                    </div>
                </div>

                <!-- Image Suggestions -->
                <div th:each="suggestion : ${allSuggestions}" th:if="${suggestion.suggestionType.name() == 'IMAGE'}"
                    th:classappend="${viewedMap.get(suggestion.suggestionId)} ? 'viewed-card' : ''"
                    class="suggestion-card suggestion-IMAGE bg-white rounded-2xl overflow-hidden border border-slate-100 shadow-soft hover:shadow-hover transition-all cursor-pointer"
                    th:attr="data-title=${suggestion.title},
                    data-description=${suggestion.videoDescription},
                    data-image-id=${suggestion.suggestionId},
                    data-suggestion-id=${suggestion.suggestionId},
                    data-date=${#temporals.format(suggestion.postedDate, 'dd MMM yyyy')}"
                    th:onclick="'openImageModalAndMarkViewed(this, ' + ${suggestion.suggestionId} + ')'">
                    <div class="relative h-48 overflow-hidden bg-slate-100">
                        <img th:src="@{'/api/suggestions/image/' + ${suggestion.suggestionId}}"
                            alt="Health Suggestion Image"
                            class="w-full h-full object-cover hover:scale-105 transition-transform duration-300">
                    </div>
                    <div class="p-4">
                        <div class="flex items-center justify-between mb-2">
                            <div class="flex items-center gap-2">
                                <span class="text-xs font-medium px-2 py-1 rounded-full bg-green-50 text-green-600"
                                    th:text="${suggestion.category}">श्रेणी</span>
                                <span
                                    class="text-xs font-medium px-2 py-1 rounded-full bg-purple-50 text-purple-600">चित्र</span>
                                <span th:if="${viewedMap.get(suggestion.suggestionId)}"
                                    class="text-xs font-medium px-2 py-1 rounded-full bg-green-50 text-green-600">
                                    ✓ देखा गया
                                </span>
                            </div>
                            <button
                                th:onclick="'event.stopPropagation(); toggleSave(' + ${suggestion.suggestionId} + ')'"
                                th:classappend="${savedMap.get(suggestion.suggestionId)} ? 'saved' : ''"
                                class="save-btn flex items-center justify-center size-8 rounded-full hover:bg-slate-100 text-slate-400"
                                th:attr="data-save-btn=${suggestion.suggestionId}">
                                <span class="material-symbols-outlined text-[20px]">bookmark</span>
                            </button>
                        </div>
                        <h4 class="text-base font-bold text-slate-900 mb-2" th:text="${suggestion.title}">शीर्षक</h4>
                        <p class="text-sm text-slate-600 leading-relaxed mb-3 line-clamp-2"
                            th:text="${suggestion.videoDescription}">विवरण</p>
                        <div class="flex items-center justify-between">
                            <span class="text-xs text-slate-400"
                                th:text="${#temporals.format(suggestion.postedDate, 'dd MMM yyyy')}">तारीख</span>
                            <button
                                class="text-xs font-semibold text-primary hover:text-primary-dark transition-colors">विवरण
                                देखें →</button>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Empty State -->
            <div id="empty-state" class="hidden text-center py-12">
                <span class="material-symbols-outlined text-slate-300 text-[64px] mb-4">search_off</span>
                <p class="text-slate-500 font-medium">कोई सुझाव नहीं मिला</p>
                <p class="text-slate-400 text-sm">No suggestions found</p>
            </div>

        </main>

        <div th:insert="~{Fragment/PatientMobileFragment :: NavContent}"></div>

    </div>

    <script th:src="@{/FragmentScript.js}"></script>
    <script>
        function filterSuggestions(type) {
            const allCards = document.querySelectorAll('.suggestion-card');
            const emptyState = document.getElementById('empty-state');
            const tabs = document.querySelectorAll('[id^="tab-"]');

            tabs.forEach(tab => {
                tab.classList.remove('tab-active');
                tab.classList.add('tab-inactive');
            });
            document.getElementById('tab-' + type.toLowerCase()).classList.add('tab-active');
            document.getElementById('tab-' + type.toLowerCase()).classList.remove('tab-inactive');

            let visibleCount = 0;

            if (type === 'ALL') {
                allCards.forEach(card => {
                    card.style.display = 'block';
                    visibleCount++;
                });
            } else {
                allCards.forEach(card => {
                    if (card.classList.contains('suggestion-' + type)) {
                        card.style.display = 'block';
                        visibleCount++;
                    } else {
                        card.style.display = 'none';
                    }
                });
            }

            if (visibleCount === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
            }
        }

        function openTextModalAndMarkViewed(element, suggestionId) {
            openTextModal(element);
            markAsViewed(suggestionId, element);
        }

        function openVideoModalAndMarkViewed(element, suggestionId) {
            openVideoModal(element);
            markAsViewed(suggestionId, element);
        }

        function openImageModalAndMarkViewed(element, suggestionId) {
            openImageModal(element);
            markAsViewed(suggestionId, element);
        }

        function markAsViewed(suggestionId, cardElement) {
            fetch(`/api/suggestions/${suggestionId}/view`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                }
            })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        cardElement.classList.add('viewed-card');
                        const viewBadge = cardElement.querySelector('.text-green-600');
                        if (!viewBadge || !viewBadge.textContent.includes('देखा गया')) {
                            const badgeHtml = '<span class="text-xs font-medium px-2 py-1 rounded-full bg-green-50 text-green-600">✓ देखा गया</span>';
                            const badgeContainer = cardElement.querySelector('.flex.items-center.gap-2');
                            if (badgeContainer) {
                                badgeContainer.insertAdjacentHTML('beforeend', badgeHtml);
                            }
                        }
                    }
                })
                .catch(error => console.error('Error marking as viewed:', error));
        }

        function toggleSave(suggestionId) {
            const saveBtn = document.querySelector(`[data-save-btn="${suggestionId}"]`);

            fetch(`/api/suggestions/${suggestionId}/save`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                }
            })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        if (data.isSaved) {
                            saveBtn.classList.add('saved');
                        } else {
                            saveBtn.classList.remove('saved');
                        }
                    }
                })
                .catch(error => console.error('Error toggling save:', error));
        }
    </script>
</body>

</html>
