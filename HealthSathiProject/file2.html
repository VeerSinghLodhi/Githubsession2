<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Pixel Adventures - Start Game</title>
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f20d0d",
                        "background-light": "#f8f5f5",
                        "background-dark": "#221010",
                    },
                    fontFamily: {
                        "display": ["Spline Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body { font-family: "Spline Sans", sans-serif; }
        .pixel-bg {
            background-color: #87CEEB; /* Sky blue */
            position: relative;
            overflow: hidden;
        }
        .cloud-layer {
            background: radial-gradient(circle, #fff 20%, transparent 20%), radial-gradient(circle, #fff 20%, transparent 20%);
            background-size: 100px 100px;
            background-position: 0 0, 50px 50px;
            opacity: 0.4;
        }
        .hill-foreground {
            background: linear-gradient(180deg, #4ade80 0%, #166534 100%);
            clip-path: ellipse(70% 100% at 50% 100%);
        }
        .hill-background {
            background: linear-gradient(180deg, #86efac 0%, #15803d 100%);
            clip-path: ellipse(80% 100% at 20% 100%);
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display">
<!-- Main Container with Parallax-style background -->
<div class="relative flex h-screen min-h-[600px] w-full flex-col overflow-hidden pixel-bg">
<!-- Animated Background Elements -->
<div class="absolute inset-0 cloud-layer pointer-events-none" data-alt="Soft white stylized clouds on blue sky"></div>
<div class="absolute bottom-0 left-0 w-full h-[30%] hill-background opacity-60 pointer-events-none" data-alt="Rolling green hills in the distance"></div>
<div class="absolute bottom-0 left-0 w-full h-[20%] hill-foreground pointer-events-none" data-alt="Vibrant green hills in the foreground"></div>
<div class="layout-container relative z-10 flex h-full grow flex-col">
<!-- Top Navigation Bar -->
<div class="px-10 py-5">
<header class="flex items-center justify-between whitespace-nowrap rounded-full bg-white/80 dark:bg-black/40 backdrop-blur-md border border-white/20 px-6 py-3">
<div class="flex items-center gap-3 text-primary">
<div class="size-8 flex items-center justify-center bg-primary rounded-lg text-white">
<span class="material-symbols-outlined">videogame_asset</span>
</div>
<h2 class="text-[#181111] dark:text-white text-lg font-extrabold leading-tight tracking-tight">PIXEL ADVENTURES</h2>
</div>
<div class="flex gap-2">
<button class="flex size-10 cursor-pointer items-center justify-center rounded-full bg-background-light dark:bg-background-dark text-[#181111] dark:text-white border border-gray-200 dark:border-gray-800">
<span class="material-symbols-outlined">volume_up</span>
</button>
<button class="flex size-10 cursor-pointer items-center justify-center rounded-full bg-background-light dark:bg-background-dark text-[#181111] dark:text-white border border-gray-200 dark:border-gray-800">
<span class="material-symbols-outlined">settings</span>
</button>
</div>
</header>
</div>
<!-- Hero/Main Content Area -->
<main class="flex flex-1 flex-col items-center justify-center px-4 py-12">
<!-- Game Title Logo -->
<div class="mb-8 transform transition-transform hover:scale-105 cursor-default">
<h1 class="text-primary dark:text-primary text-[64px] md:text-[80px] font-black leading-none text-center drop-shadow-[0_8px_0_rgba(0,0,0,0.15)] select-none">
                        PIXEL<br/>ADVENTURES
                    </h1>
<div class="h-2 w-32 bg-primary mx-auto mt-4 rounded-full opacity-50"></div>
</div>
<!-- Start Button (Pulsing interaction style) -->
<div class="flex px-4 py-10 justify-center">
<button class="group relative flex min-w-[240px] cursor-pointer items-center justify-center overflow-hidden rounded-full h-20 px-10 bg-primary text-white gap-4 shadow-[0_10px_0_#b91c1c] active:shadow-none active:translate-y-2 transition-all">
<span class="material-symbols-outlined text-4xl group-hover:rotate-12 transition-transform">play_circle</span>
<span class="truncate text-2xl font-black tracking-widest uppercase">Start Game</span>
</button>
</div>
<!-- Secondary Actions -->
<div class="flex gap-4 mt-4">
<button class="px-6 py-2 rounded-full bg-white/90 dark:bg-black/40 text-sm font-bold border border-gray-200 dark:border-gray-700 text-[#181111] dark:text-white hover:bg-white dark:hover:bg-black transition-colors">
                        Leaderboard
                    </button>
<button class="px-6 py-2 rounded-full bg-white/90 dark:bg-black/40 text-sm font-bold border border-gray-200 dark:border-gray-700 text-[#181111] dark:text-white hover:bg-white dark:hover:bg-black transition-colors">
                        Characters
                    </button>
</div>
</main>
<!-- Bottom Stats and Footer Area -->
<div class="w-full flex flex-col gap-4">
<div class="flex justify-center px-10">
<div class="flex min-w-[200px] flex-col items-center gap-1 rounded-2xl p-4 bg-white/90 dark:bg-black/60 backdrop-blur-sm border border-white/40 dark:border-white/10 shadow-xl">
<div class="flex items-center gap-2 text-primary">
<span class="material-symbols-outlined font-bold">military_tech</span>
<p class="text-[#181111] dark:text-white text-xs font-bold uppercase tracking-widest">High Score</p>
</div>
<p class="text-primary tracking-tighter text-3xl font-black">999,999</p>
</div>
</div>
<footer class="flex flex-col gap-4 px-10 py-8 text-center bg-white/30 dark:bg-black/20 backdrop-blur-sm">
<div class="flex flex-wrap items-center justify-center gap-8">
<a class="text-[#181111] dark:text-white/70 text-sm font-bold hover:text-primary dark:hover:text-primary transition-colors uppercase tracking-widest" href="#">Support</a>
<a class="text-[#181111] dark:text-white/70 text-sm font-bold hover:text-primary dark:hover:text-primary transition-colors uppercase tracking-widest" href="#">Privacy</a>
<a class="text-[#181111] dark:text-white/70 text-sm font-bold hover:text-primary dark:hover:text-primary transition-colors uppercase tracking-widest" href="#">License</a>
</div>
<p class="text-[#181111] dark:text-white/50 text-xs font-bold uppercase tracking-widest mt-2">© 2024 Pixel Adventures • Made with ❤️ for Gamers</p>
</footer>
</div>
</div>
</div>
</body></html>
